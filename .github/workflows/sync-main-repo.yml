name: Sync with upstream

on:
  schedule:
    - cron: '*/30 * * * *'   # every 30 minutes
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          repository: axcap1/spotify-playlist-archive
          token: ${{ secrets.PERSONAL_TOKEN }}
      - name: Add upstream
        run: |
          git remote add upstream https://github.com/mackorone/spotify-playlist-archive.git
          git fetch upstream
          git merge upstream/master --no-edit
          git push origin master
